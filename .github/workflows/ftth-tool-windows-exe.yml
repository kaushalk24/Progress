# Builds the stand-alone Windows program of the FTTH address-list tool (ftth-address-list-tool/).
# Every push that changes the tool: tests + build + smoke test; the zip is kept as a run artifact.
# Manual run ("Run workflow") with "publish" ticked also attaches the zip to a GitHub pre-release.
name: FTTH address-list tool - Windows program

on:
  push:
    paths:
      - "ftth-address-list-tool/**"
      - ".github/workflows/ftth-tool-windows-exe.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the zip to a pre-release (tag ftth-address-list-tool-v<version>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ftth-address-list-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test packages
        run: python -m pip install -r packaging/requirements-build.txt pytest ezdxf

      - name: Tests
        run: python -m pytest -q tests

      - name: Build and smoke-test the program
        run: python packaging/build.py

      - name: Version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import ftth_addrlist; print(ftth_addrlist.__version__)')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: FTTH_Address_List_Tool_v${{ steps.ver.outputs.version }}_windows
          path: ftth-address-list-tool/dist/FTTH_Address_List_Tool_v${{ steps.ver.outputs.version }}_windows.zip
          retention-days: 90

      - name: Publish pre-release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ftth-address-list-tool-v${{ steps.ver.outputs.version }}"
          zip="dist/FTTH_Address_List_Tool_v${{ steps.ver.outputs.version }}_windows.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --prerelease --target "$GITHUB_SHA" \
              --title "FTTH Address List Tool v${{ steps.ver.outputs.version }} (Windows)" \
              --notes "Stand-alone Windows program: unzip, keep the folder together, double-click 'FTTH Address List Tool.exe'. No Python needed. See 'HOW TO RUN.txt' inside."
          fi
