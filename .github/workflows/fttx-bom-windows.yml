name: FTTx BOM Tool - Windows app

on:
  push:
    paths:
      - "fttx_bom/**"
      - ".github/workflows/fttx-bom-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: fttx_bom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1 pywebview==5.3.2
          cd tools
          npm ci --ignore-scripts

      - name: Tests (Windows)
        run: python -m pytest -q -m "not slow"

      - name: Build executables
        run: |
          $version = python packaging/make_version_info.py
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:NODE_EXE = (Get-Command node).Source
          python -m PyInstaller packaging/fttx_bom.spec --noconfirm --clean

      - name: Self-test of the packaged app
        run: |
          & "dist\FTTx BOM Tool\fttx-bom.exe" --version
          & "dist\FTTx BOM Tool\fttx-bom.exe" --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installer and portable zip
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path "dist\FTTx BOM Tool" -DestinationPath "dist\FTTx-BOM-Tool-$env:VERSION-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: FTTx-BOM-Tool-${{ env.VERSION }}-windows
          path: |
            fttx_bom/dist/FTTx-BOM-Tool-Setup-*.exe
            fttx_bom/dist/FTTx-BOM-Tool-*-portable.zip
          if-no-files-found: error
